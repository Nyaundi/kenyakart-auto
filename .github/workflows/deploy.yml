name: Deploy KenyaKart Auto

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.AZURE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy site files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            index3d.html "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}:/var/www/kenyakart-auto/index.html"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            index.html "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}:/var/www/kenyakart-auto/classic.html"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            car "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}:/var/www/kenyakart-auto/car"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key
